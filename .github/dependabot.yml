# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scans 3 ecosystems weekly, groups patch/minor updates into one PR per
# ecosystem to keep PR noise low. Security updates always come immediately
# regardless of schedule.
version: 2
updates:
  # -------------------------------------------------------------------------
  # Backend — Python (FastAPI server + ingestion scripts)
  # -------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(py)"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # -------------------------------------------------------------------------
  # Frontend — npm (Vue 3 SPA)
  # -------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Ignore TypeScript major bumps (they often break Vue type defs)
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # -------------------------------------------------------------------------
  # CI — GitHub Actions (cron RSS ingestion workflow)
  # -------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

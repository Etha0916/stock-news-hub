name: Ingest News

# Cron-triggered RSS fetch + classify + write to Supabase.
# No more GitHub Pages — the live site is on Vercel and reads from the DB.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (cadence ~10–15 min in practice)
  workflow_dispatch:           # manual run from Actions tab
  push:
    branches: [main]
    paths:
      - "config.py"
      - "classify.py"
      - "ingest.py"
      - "db.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest.py

name: Ingest News

# Cron-triggered RSS fetch + classify + write to Supabase.
# No more GitHub Pages — the live site is on Vercel and reads from the DB.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (cadence ~10–15 min in practice)
  workflow_dispatch:           # manual run from Actions tab
  push:
    branches: [main]
    paths:
      - "config.py"
      - "classify.py"
      - "ingest.py"
      - "db.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Bumped from 5 to 15 minutes: sentiment scoring adds ~1-2s per new
    # article via Anthropic API. At ~100-200 new articles per run, that's
    # 2-7 minutes just for sentiment on top of the regular fetch + dedupe.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # ANTHROPIC_API_KEY is optional: when set, ingest scores sentiment
          # via Claude Haiku 4.5; when unset, sentiment columns stay NULL.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u ingest.py

name: Build & Deploy

# When does this run?
#   - On a 15-minute cron (best-effort; GitHub may delay during peak load)
#   - Every push to main (so config / classifier changes deploy immediately)
#   - Manual trigger from the Actions tab
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "config.py"
      - "classify.py"
      - "build.py"
      - "docs/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't pile up multiple deploys on top of each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
